name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate native Android scaffolding
        run: flutter create --platforms=android --org com.appbijoux.gestion scaffold

      - name: Overlay app code onto scaffold
        run: |
          rm -rf scaffold/lib scaffold/pubspec.yaml scaffold/assets
          cp -r lib scaffold/lib
          cp pubspec.yaml scaffold/pubspec.yaml
          if [ -d assets ]; then cp -r assets scaffold/assets; fi

      - name: Install dependencies
        working-directory: scaffold
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_BIJOUX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APP_BIJOUX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_BIJOUX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_BIJOUX_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/scaffold/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          # Vérifie tout de suite, avec un message d'erreur clair, que la clé
          # stockée en secret peut bien être relue avant de lancer le build complet.
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" > /dev/null

          # Le scaffold Android est régénéré à chaque run par `flutter create`, donc la
          # config de signature ne peut pas vivre dans un fichier versionné : on écrit un
          # key.properties (lu directement par le script Gradle, pas via variable
          # d'environnement — plus fiable si Gradle réutilise un démon déjà démarré).
          cat > scaffold/android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          PROPS

          KTS_FILE="scaffold/android/app/build.gradle.kts"
          if [ -f "$KTS_FILE" ]; then
            TARGET_FILE="$KTS_FILE"
            # Les imports Kotlin doivent être en tête de fichier ; une référence
            # qualifiée "java.util...." inline se fait shadow par l'accesseur Gradle
            # "java" injecté par le plugin Kotlin, d'où le besoin de les préfixer ici.
            printf 'import java.util.Properties\nimport java.io.FileInputStream\n%s\n' "$(cat "$TARGET_FILE")" > "$TARGET_FILE"
            SNIPPET='val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }'
          else
            TARGET_FILE="scaffold/android/app/build.gradle"
            SNIPPET='def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }'
          fi
          printf '%s\n' "$SNIPPET" >> "$TARGET_FILE"

      - name: Build release APK
        working-directory: scaffold
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bijoux-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
