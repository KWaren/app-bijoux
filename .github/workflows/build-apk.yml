name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate native Android scaffolding
        run: flutter create --platforms=android --org com.appbijoux.gestion scaffold

      - name: Overlay app code onto scaffold
        run: |
          rm -rf scaffold/lib scaffold/pubspec.yaml scaffold/assets
          cp -r lib scaffold/lib
          cp pubspec.yaml scaffold/pubspec.yaml
          if [ -d assets ]; then cp -r assets scaffold/assets; fi

      - name: Install dependencies
        working-directory: scaffold
        run: flutter pub get

      - name: Build release APK
        working-directory: scaffold
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bijoux-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
