name: Generate release keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore and random passwords
        run: |
          STORE_PASS=$(openssl rand -base64 24)
          KEY_PASS=$(openssl rand -base64 24)
          keytool -genkeypair -v -keystore release.jks -alias appbijoux \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=App Bijoux, OU=App Bijoux, O=App Bijoux, C=US"

          # keytool -list ne déchiffre pas la clé privée (seul le certificat est lu),
          # donc ça ne prouve rien sur -keypass : on vérifie ici avec jarsigner, qui a
          # réellement besoin de déchiffrer la clé pour signer.
          echo test > test.txt
          jar cf test.jar test.txt
          jarsigner -keystore release.jks -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -signedjar test-signed.jar test.jar appbijoux
          jarsigner -verify -keystore release.jks -storepass "$STORE_PASS" test-signed.jar
          echo "Vérification jarsigner OK : le mot de passe de la clé est correct."

          base64 -w0 release.jks > release.jks.b64
          printf '%s' "$STORE_PASS" > store_password.txt
          printf '%s' "$KEY_PASS" > key_password.txt
          printf '%s' "appbijoux" > key_alias.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.jks.b64
            store_password.txt
            key_password.txt
            key_alias.txt
          retention-days: 1
