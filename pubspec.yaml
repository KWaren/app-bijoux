name: stock_flow
description: Application de gestion pour petit commerce (stock, ventes, dépenses)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  intl: ^0.19.0
  excel: ^4.0.6
  share_plus: ^13.3.0
  image_picker: ^1.1.2
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Icône de lancement (voir .github/workflows/build-apk.yml, exécuté sur le
# scaffold généré en CI via `dart run flutter_launcher_icons`). Fond
# transparent des deux côtés (legacy et adaptatif) pour n'afficher que le
# logo, sans carré/cercle de couleur derrière.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
